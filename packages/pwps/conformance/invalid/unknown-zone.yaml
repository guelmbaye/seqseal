pwps: "0.1"
protocol: { id: "BAD-ZONE", version: "1.0.0", name: "Undeclared zone" }
zones:
  - { id: staging }
states:
  - { id: a, required: true, zone: staging }
  - { id: b, required: true, terminal: true, zone: cold-room }
