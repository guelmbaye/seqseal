# Months are calendar-dependent and therefore not deterministic.
pwps: "0.1"
protocol: { id: "BAD-MONTH", version: "1.0.0", name: "Calendar duration" }
states:
  - { id: a, required: true }
  - { id: b, required: true, terminal: true }
constraints:
  - { id: TEMP-01, operator: WITHIN, state: b, after: a, duration: "P1M" }
