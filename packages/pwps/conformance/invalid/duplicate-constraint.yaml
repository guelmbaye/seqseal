pwps: "0.1"
protocol: { id: "BAD-DUPRULE", version: "1.0.0", name: "Duplicate constraint id" }
states:
  - { id: a, required: true }
  - { id: b, required: true, terminal: true }
constraints:
  - { id: ORDER-01, operator: BEFORE, state: a, reference: b }
  - { id: ORDER-01, operator: REQUIRED, state: a }
