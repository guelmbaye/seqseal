name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck (packages, services, web)
        run: pnpm typecheck
      - name: Tests (unit, conformance, golden, end-to-end)
        run: pnpm test
      - name: Benchmark release gate
        run: pnpm benchmark --check
      - name: Validate PWPS protocol
        run: pnpm pwps validate protocols/inbound-delivery.yaml
      - name: Build PWPS package, Lambda bundles and web app
        run: pnpm build
      - name: Parse Terraform
        run: pnpm hcl:check
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
